name: Bridge checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  upstream-pdo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Read pinned native toolchain
        id: toolchain
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('native/upstream-versions.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(pins.emsdkCommit)) throw new Error('Emsdk must use an immutable commit');
          if (!/^\d+\.\d+\.\d+$/.test(pins.emscriptenVersion)) throw new Error('Invalid compiler version');
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${pins.emsdkCommit}\nversion=${pins.emscriptenVersion}\n`);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: ${{ steps.toolchain.outputs.commit }}
          path: .native-build/emsdk
          persist-credentials: false
      - name: Install compiler and PHP configuration prerequisites
        env:
          EMSCRIPTEN_VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf automake bison re2c libtool pkg-config
          npm ci --ignore-scripts
          .native-build/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          .native-build/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Compile loadable PDO extensions against matching PHP headers
        run: |
          source .native-build/emsdk/emsdk_env.sh
          while IFS= read -r minor; do
            npm run build:upstream -- "$minor"
          done < <(node --input-type=module -e "import p from './native/upstream-versions.json' with {type:'json'}; for (const minor of Object.keys(p.php)) console.log(minor)")
      - name: Test native PDO and request cleanup in published upstream PHP
        run: npm run test:upstream
      - name: Retain verified native modules and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-pdo-extensions
          path: |
            .native-build/upstream/php*-pdo-mariadb-wasm.so
            .native-build/upstream/php*-pdo-mariadb-wasm.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRIDGE_BROWSERS: chromium,firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Verify native PHP build dependencies
        run: |
          if ! command -v php8.3 >/dev/null || ! command -v php-config8.3 >/dev/null || ! command -v cc >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --no-upgrade -y php8.3-cli php8.3-dev build-essential
          fi
          test -f "$(php-config8.3 --include-dir)/main/php.h"
          php8.3 --version
          php-config8.3 --version
      - name: Install browser test binaries
        # ubuntu-24.04 already includes Chrome/Firefox system libraries. Avoid
        # unrelated apt upgrades; Playwright still validates its host libraries.
        run: npx playwright install --only-shell chromium firefox
      - name: Check and test the real MariaDB engine
        run: npm test
      - name: Compile and exercise the native PDO driver
        env:
          PHP_BIN: php8.3
          PHP_CONFIG: php-config8.3
        run: npm run test:native
      - name: Package the tested bridge and engine
        run: npm run release:package
      - name: Verify standalone release
        run: node scripts/smoke-release.mjs
      - name: Retain the verified release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
